# Arca security hardening. Installed AS /etc/sysctl.conf: rcS.d/S30procps.sh
# runs `sysctl -q -p /etc/sysctl.conf` and nothing on this image reads /etc/sysctl.d.
# Every active line of the vendor's file is carried over, so replacing it loses nothing.
# Each key must exist under /proc/sys on this kernel, or sysctl prints an error on the
# boot console; tcp_syncookies does not (no CONFIG_SYN_COOKIES), so it is absent.
kernel.randomize_va_space = 2
kernel.dmesg_restrict = 1
kernel.core_pattern = |/bin/false
kernel.sysrq = 0
net.ipv4.ip_forward = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
# The vendor's: "Increased min free kbytes value to avoid page allocation failure issue."
vm.min_free_kbytes = 4096
